<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Grid Lighter</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #1a1a24;
            --grid-bg: #0f0f15;
            --off-color: #3b3b4f;
            --on-color: #fce303; 
            --player-color: #ffffff;
            --text-color: #eeeeee;
            --grid-size: 3;
            --cell-size: 100px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        .selectable, .selectable a {
            user-select: text !important;
            -webkit-user-select: text !important;
        }

        h1 {
            font-size: 24px;
            text-shadow: 3px 3px 0px #000;
            margin-bottom: 20px;
            color: var(--on-color);
            transition: color 0.3s;
        }

        #ui-bar {
            display: flex;
            justify-content: space-between;
            width: 320px;
            margin-bottom: 20px;
            font-size: 12px;
            line-height: 1.5;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), var(--cell-size));
            grid-template-rows: repeat(var(--grid-size), var(--cell-size));
            gap: 10px;
            background-color: var(--grid-bg);
            padding: 10px;
            border: 4px solid #555;
            box-shadow: 8px 8px 0px #000;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: var(--off-color);
            position: relative;
            box-sizing: border-box;
            border: 4px solid #222;
            transition: background-color 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #111;
        }

        .cell.on {
            background-color: var(--on-color);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: inset 4px 4px 0px rgba(255, 255, 255, 0.3);
        }

        .cell.half {
            background: repeating-linear-gradient(
              45deg,
              var(--on-color),
              var(--on-color) 10px,
              var(--off-color) 10px,
              var(--off-color) 20px
            );
            border-color: rgba(255, 255, 255, 0.1);
        }

        .cell.double::before {
            content: '2';
            position: absolute;
            color: rgba(255, 255, 255, 0.3);
            font-size: 32px;
            z-index: 1;
        }

        .cell.powerup {
            background-color: #03b6fc !important;
            border-color: #0288d1 !important;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.8) !important;
        }
        .cell.powerup::before {
            content: '+';
            position: absolute;
            color: #fff;
            font-size: 40px;
            text-shadow: 2px 2px 0 #000;
            z-index: 1;
        }

        .cell.wall, .cell.crumbled {
            background-color: #333 !important;
            border-color: #111 !important;
            box-shadow: none !important;
        }
        .cell.wall::before, .cell.crumbled::before {
            content: 'X';
            color: #111;
        }
        
        .cell.bad {
            background-color: #ff2a2a !important;
            border-color: #880000 !important;
        }
        
        .cell.crumbling {
            border: 4px dashed #888 !important;
        }

        .player::after {
            content: '';
            position: absolute;
            top: 10%;
            left: 10%;
            right: 10%;
            bottom: 10%;
            border: 4px solid var(--player-color);
            animation: pulse 0.5s infinite alternate;
            z-index: 5;
        }

        @keyframes pulse {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.5; transform: scale(0.85); }
        }

        #screens {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        #settings-box {
            background: #222;
            border: 4px solid var(--on-color);
            padding: 15px;
            margin-top: 10px;
            box-shadow: 6px 6px 0px #000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 320px;
            box-sizing: border-box;
            transition: border-color 0.3s;
            max-height: 70vh;
            overflow-y: auto;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
        }

        .setting-divider {
            text-align: center;
            color: var(--on-color);
            font-size: 10px;
            margin-top: 10px;
            margin-bottom: 5px;
            border-bottom: 2px dashed #555;
            padding-bottom: 5px;
        }

        select {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            background: #000;
            color: #fff;
            border: 2px solid #555;
            padding: 4px;
            outline: none;
            cursor: pointer;
        }

        button {
            font-family: 'Press Start 2P', monospace;
            background-color: var(--on-color);
            color: #000;
            border: 4px solid #fff;
            padding: 15px;
            font-size: 12px; 
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            margin-top: 25px;
            transition: background-color 0.3s;
        }

        button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <h1>GRID LIGHTER</h1>

    <div id="ui-bar">
        <div><span id="stat-1-label">TIME:</span><br><span id="stat-1-val">0</span></div>
        <div style="text-align: right;"><span id="stat-2-label">SCORE:</span><br><span id="stat-2-val">0</span></div>
    </div>

    <div id="grid"></div>

    <div id="screens">
        <h2 id="screen-title" style="color: var(--on-color);">READY?</h2>
        
        <div id="settings-box">
            <div class="setting-row">
                <span>GRID:</span>
                <select id="set-grid">
                    <option value="2">2x2</option>
                    <option value="3" selected>3x3</option>
                    <option value="4">4x4</option>
                    <option value="5">5x5</option>
                </select>
            </div>
            <div class="setting-row">
                <span>THEME:</span>
                <select id="set-theme">
                    <option value="#fce303" selected>Yellow</option>
                    <option value="#fc2403">Red</option>
                    <option value="#03b6fc">Blue</option>
                    <option value="#20fc03">Green</option>
                </select>
            </div>
            <div class="setting-row">
                <span>MODE:</span>
                <select id="set-mode">
                    <option value="timer" selected>Timer Finish</option>
                    <option value="score">Score Finish</option>
                </select>
            </div>
            <div class="setting-row">
                <span>GOAL:</span>
                <select id="set-goal"></select>
            </div>
            
            <div class="setting-divider">TILE SETTINGS</div>
            
            <div class="setting-row"><span>WALLS:</span><select id="set-walls"><option value="on" selected>On</option><option value="off">Off</option></select></div>
            <div class="setting-row"><span>TRAPS (RED):</span><select id="set-bad"><option value="on" selected>On</option><option value="off">Off</option></select></div>
            <div class="setting-row"><span>CRUMBLING:</span><select id="set-crumbling"><option value="on" selected>On</option><option value="off">Off</option></select></div>
            <div class="setting-row"><span>DOUBLE (2):</span><select id="set-double"><option value="on" selected>On</option><option value="off">Off</option></select></div>
            <div class="setting-row"><span>POWERUP (+):</span><select id="set-powerup"><option value="on" selected>On</option><option value="off">Off</option></select></div>
        </div>
        
        <div id="results-box" class="hidden" style="margin-top: 20px;"></div>

        <div style="display: flex; gap: 10px;" id="menu-buttons">
            <button id="start-btn">LOCAL</button>
            <button id="create-lobby-btn" style="background-color: #03b6fc;">CREATE</button>
            <button id="join-lobby-btn" style="background-color: #fc2403;">JOIN</button>
        </div>
        
        <div id="waiting-room" class="hidden" style="text-align: center; margin-top: 20px;">
            <h3 style="color: var(--on-color);">WAITING FOR OPPONENT...</h3>
            <p id="room-code-display" class="selectable" style="font-size: 12px; margin: 10px 0;"></p>
            <button id="ready-btn" style="background-color: #20fc03; font-size: 16px;">I'M READY</button>
        </div>
    </div>

    <script>
        const gridElement = document.getElementById('grid');
        const screens = document.getElementById('screens');
        const screenTitle = document.getElementById('screen-title');
        const startBtn = document.getElementById('start-btn');
        const menuButtons = document.getElementById('menu-buttons');
        
        const stat1Label = document.getElementById('stat-1-label');
        const stat1Val = document.getElementById('stat-1-val');
        const stat2Label = document.getElementById('stat-2-label');
        const stat2Val = document.getElementById('stat-2-val');

        const setGrid = document.getElementById('set-grid');
        const setTheme = document.getElementById('set-theme');
        const setMode = document.getElementById('set-mode');
        const setGoal = document.getElementById('set-goal');
        
        const setWalls = document.getElementById('set-walls');
        const setBad = document.getElementById('set-bad');
        const setCrumbling = document.getElementById('set-crumbling');
        const setDouble = document.getElementById('set-double');
        const setPowerup = document.getElementById('set-powerup');

        let grid = [];
        let tileTypes = []; 
        let playerX = 0;
        let playerY = 0;
        let score = 0;
        let timer = 0;
        let gameActive = false;
        let timerInterval = null;

        let currentGridSize = 3;
        let currentMode = 'timer'; 
        let currentGoal = 60; 
        
        // Tile setting state
        let tileSettings = {
            walls: 'on',
            bad: 'on',
            crumbling: 'on',
            double: 'on',
            powerup: 'on'
        };

        const createLobbyBtn = document.getElementById('create-lobby-btn');
        const joinLobbyBtn = document.getElementById('join-lobby-btn'); 
        const waitingRoom = document.getElementById('waiting-room');
        const roomCodeDisplay = document.getElementById('room-code-display');
        const readyBtn = document.getElementById('ready-btn');
        const settingsBox = document.getElementById('settings-box');
        const resultsBox = document.getElementById('results-box');

        const socket = io();
        let currentRoom = null;
        let isMultiplayer = false;

        const urlParams = new URLSearchParams(window.location.search);
        const inviteCode = urlParams.get('room');

        function updateGoalOptions() {
            setGoal.innerHTML = '';
            if (setMode.value === 'timer') {
                const options = [10, 30, 60, 90];
                options.forEach(opt => {
                    const el = document.createElement('option');
                    el.value = el.innerText = opt;
                    if(opt === 60) el.selected = true;
                    setGoal.appendChild(el);
                });
            } else {
                const options = [5, 10, 15, 20];
                options.forEach(opt => {
                    const el = document.createElement('option');
                    el.value = el.innerText = opt;
                    if(opt === 10) el.selected = true;
                    setGoal.appendChild(el);
                });
            }
        }

        setTheme.addEventListener('change', (e) => {
            document.documentElement.style.setProperty('--on-color', e.target.value);
        });

        setMode.addEventListener('change', updateGoalOptions);

        function applySettings() {
            currentGridSize = parseInt(setGrid.value);
            currentMode = setMode.value;
            currentGoal = parseInt(setGoal.value);
            
            tileSettings.walls = setWalls.value;
            tileSettings.bad = setBad.value;
            tileSettings.crumbling = setCrumbling.value;
            tileSettings.double = setDouble.value;
            tileSettings.powerup = setPowerup.value;

            const cellSize = Math.floor(300 / currentGridSize) + 'px';
            document.documentElement.style.setProperty('--grid-size', currentGridSize);
            document.documentElement.style.setProperty('--cell-size', cellSize);
        }

        function createGridElements() {
            gridElement.innerHTML = '';
            for (let y = 0; y < currentGridSize; y++) {
                for (let x = 0; x < currentGridSize; x++) {
                    const cell = document.createElement('div');
                    cell.id = `cell-${x}-${y}`;
                    gridElement.appendChild(cell);
                }
            }
        }

        function generateLevel(isFirstLevel = false) {
            grid = [];
            tileTypes = [];
            let allOn = true;
            
            if (isFirstLevel) {
                playerX = 0;
                playerY = 0;
            }

            for (let y = 0; y < currentGridSize; y++) {
                let rowGrid = [];
                let rowTypes = [];
                for (let x = 0; x < currentGridSize; x++) {
                    let type = 'normal';
                    
                    // Don't spawn hazards right on the player
                    if (!(x === playerX && y === playerY)) {
                        let rand = Math.random();
                        let threshold = 0;
                        
                        if (tileSettings.walls === 'on') {
                            threshold += 0.05; 
                            if (rand < threshold) type = 'wall';
                        }
                        if (type === 'normal' && tileSettings.bad === 'on') {
                            threshold += 0.07;
                            if (rand < threshold) type = 'bad';
                        }
                        if (type === 'normal' && tileSettings.crumbling === 'on') {
                            threshold += 0.06;
                            if (rand < threshold) type = 'crumbling';
                        }
                        if (type === 'normal' && tileSettings.double === 'on') {
                            threshold += 0.12;
                            if (rand < threshold) type = 'double';
                        }
                        if (type === 'normal' && tileSettings.powerup === 'on') {
                            threshold += 0.05;
                            if (rand < threshold) type = 'powerup';
                        }
                    }

                    let state = 0;
                    if (type === 'wall' || type === 'crumbled' || type === 'bad') {
                        state = 0;
                    } else if (type === 'double') {
                        state = (Math.random() > 0.5) ? 2 : 0; 
                    } else {
                        state = (Math.random() > 0.5) ? 1 : 0;
                    }

                    rowGrid.push(state);
                    rowTypes.push(type);
                    
                    if (type !== 'wall' && type !== 'crumbled' && type !== 'bad') {
                        if (type === 'double' && state !== 2) allOn = false;
                        if (type !== 'double' && state !== 1) allOn = false;
                    }
                }
                grid.push(rowGrid);
                tileTypes.push(rowTypes);
            }
            
            if (allOn) {
                let offX = (playerX + 1) % currentGridSize;
                if (tileTypes[playerY][offX] === 'wall' || tileTypes[playerY][offX] === 'bad') {
                    tileTypes[playerY][offX] = 'normal';
                }
                grid[playerY][offX] = 0; 
            }
            
            renderGrid();
        }

        function renderGrid() {
            for (let y = 0; y < currentGridSize; y++) {
                for (let x = 0; x < currentGridSize; x++) {
                    const cell = document.getElementById(`cell-${x}-${y}`);
                    cell.className = 'cell'; 
                    
                    const type = tileTypes[y][x];
                    const state = grid[y][x];

                    if (type !== 'normal') cell.classList.add(type);
                    
                    if (state === 1 && type === 'double') cell.classList.add('half');
                    else if (state === 1 && type !== 'double') cell.classList.add('on');
                    else if (state === 2) cell.classList.add('on');
                    
                    if (x === playerX && y === playerY) cell.classList.add('player');
                }
            }
        }

        function toggleTile(tx, ty) {
            const tType = tileTypes[ty][tx];
            if (tType === 'wall' || tType === 'crumbled' || tType === 'bad') return;
            
            if (tType === 'double') {
                grid[ty][tx] = (grid[ty][tx] + 1) % 3; 
            } else {
                grid[ty][tx] = grid[ty][tx] === 1 ? 0 : 1; 
            }
        }

        function movePlayer(dx, dy) {
            if (!gameActive) return;

            const newX = playerX + dx;
            const newY = playerY + dy;

            if (newX >= 0 && newX < currentGridSize && newY >= 0 && newY < currentGridSize) {
                
                if (tileTypes[newY][newX] === 'wall' || tileTypes[newY][newX] === 'crumbled') return;

                if (tileTypes[playerY][playerX] === 'crumbling') {
                    tileTypes[playerY][playerX] = 'crumbled';
                    grid[playerY][playerX] = 0;
                }

                playerX = newX;
                playerY = newY;
                
                if (tileTypes[playerY][playerX] === 'bad') {
                    tileTypes[playerY][playerX] = 'normal'; 
                    if (currentMode === 'timer') timer = Math.max(0, timer - 5);
                    else score = Math.max(0, score - 1);
                    if (isMultiplayer) socket.emit('updateScore', { roomId: currentRoom, score: score, timer: timer });
                    updateUI();
                }

                let triggeredPowerup = false;
                if (tileTypes[playerY][playerX] === 'powerup') {
                    tileTypes[playerY][playerX] = 'normal'; 
                    triggeredPowerup = true;
                }

                toggleTile(playerX, playerY);

                if (triggeredPowerup) {
                    for (let i = 0; i < currentGridSize; i++) {
                        if (i !== playerX) toggleTile(i, playerY);
                        if (i !== playerY) toggleTile(playerX, i);
                    }
                }
                
                renderGrid();
                checkWinCondition();
            }
        }

        function checkWinCondition() {
            for (let y = 0; y < currentGridSize; y++) {
                for (let x = 0; x < currentGridSize; x++) {
                    const type = tileTypes[y][x];
                    const state = grid[y][x];
                    
                    if (type === 'wall' || type === 'crumbled' || type === 'bad') continue; 
                    
                    if (type === 'double') {
                        if (state !== 2) return;
                    } else {
                        if (state !== 1) return;
                    }
                }
            }
            
            score++;
            if (isMultiplayer) {
                socket.emit('updateScore', { roomId: currentRoom, score: score, timer: timer });
            }
            updateUI();
            
            if (currentMode === 'score' && score >= currentGoal) {
                endGame(true);
            } else {
                generateLevel(false); 
            }
        }

        function updateUI() {
            if (currentMode === 'timer') {
                stat1Label.innerText = 'TIME LEFT:';
                stat1Val.innerText = timer + 's';
                stat2Label.innerText = 'SCORE:';
                stat2Val.innerText = (score * 100);
            } else {
                stat1Label.innerText = 'TIME:';
                stat1Val.innerText = timer + 's';
                stat2Label.innerText = 'COMPLETED:';
                stat2Val.innerText = score + ' / ' + currentGoal;
            }
        }

        function startGame() {
            applySettings();
            createGridElements();
            
            score = 0;
            timer = (currentMode === 'timer') ? currentGoal : 0;
            gameActive = true;
            
            updateUI();
            screens.classList.add('hidden');
            
            generateLevel(true); 
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (currentMode === 'timer') {
                    timer--;
                    if (timer <= 0) endGame(false);
                } else {
                    timer++; 
                }
                updateUI();
            }, 1000);
        }

        function endGame(wonInScoreMode, customMessage = null) {
            gameActive = false;
            clearInterval(timerInterval);
            
            settingsBox.classList.add('hidden');
            waitingRoom.classList.add('hidden');
            menuButtons.classList.add('hidden');
            
            resultsBox.classList.remove('hidden');
            
            let finalDisplayScore = score * 100;
            
            if (customMessage) {
                screenTitle.innerText = "MATCH OVER";
                screenTitle.style.color = "var(--text-color)";
                resultsBox.innerHTML = `<div style="text-align:center; font-size:14px; line-height:2">${customMessage}</div>`;
            } else if (currentMode === 'timer') {
                screenTitle.innerText = "TIME'S UP!";
                screenTitle.style.color = "var(--text-color)";
                resultsBox.innerHTML = 
                    `<div style="text-align:center; font-size:14px; line-height:2">
                        Final Score:<br><span style="color:var(--on-color); font-size:24px">${finalDisplayScore}</span>
                     </div>`;
            } else {
                screenTitle.innerText = "COMPLETE!";
                screenTitle.style.color = "var(--on-color)";
                resultsBox.innerHTML = 
                    `<div style="text-align:center; font-size:14px; line-height:2">
                        Finished ${currentGoal} boards in:<br><span style="color:var(--on-color); font-size:24px">${timer}s</span>
                     </div>`;
            }
            
            if (isMultiplayer && !customMessage) {
                 socket.emit('gameOver', { roomId: currentRoom, score: (currentMode === 'timer' ? finalDisplayScore : timer) });
            }

            startBtn.innerText = "MENU";
            menuButtons.classList.remove('hidden');
            createLobbyBtn.classList.add('hidden');
            joinLobbyBtn.classList.add('hidden');

            startBtn.onclick = () => {
                resultsBox.classList.add('hidden');
                settingsBox.classList.remove('hidden');
                startBtn.innerText = "LOCAL";
                createLobbyBtn.classList.remove('hidden');
                joinLobbyBtn.classList.remove('hidden');
                screenTitle.innerText = "READY?";
                screenTitle.style.color = "var(--on-color)";
                
                if (isMultiplayer) {
                    history.pushState({}, '', '/');
                    window.location.reload(); 
                } else {
                    startBtn.onclick = startGame;
                }
            };
            
            screens.classList.remove('hidden');
        }

        window.addEventListener('keydown', (e) => {
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight", " "].indexOf(e.code) > -1) {
                e.preventDefault(); 
            }
            
            if (e.key === 'Escape' && gameActive && !isMultiplayer) {
                endGame(false, "GAME CANCELED");
                return;
            }

            if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') movePlayer(0, -1);
            if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') movePlayer(0, 1);
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') movePlayer(-1, 0);
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') movePlayer(1, 0);
        });

        updateGoalOptions();
        startBtn.onclick = startGame;

        joinLobbyBtn.addEventListener('click', () => {
            const code = prompt("Enter the 5-letter Room Code:");
            if (code && code.trim().length > 0) {
                let cleanCode = code.split('=').pop().trim();
                window.location.href = `/?room=${cleanCode.toUpperCase()}`;
            }
        });

        if (inviteCode) {
            isMultiplayer = true;
            socket.emit('joinLobby', inviteCode);
            currentRoom = inviteCode;
            
            settingsBox.classList.add('hidden');
            menuButtons.classList.add('hidden');
            waitingRoom.classList.remove('hidden');
            roomCodeDisplay.innerText = "Joined Room: " + inviteCode;
        }

        createLobbyBtn.addEventListener('click', () => {
            isMultiplayer = true;
            applySettings();
            
            const settings = { 
                grid: currentGridSize, 
                mode: currentMode, 
                goal: currentGoal,
                theme: setTheme.value,
                tiles: tileSettings
            };
            socket.emit('createLobby', settings);
            
            settingsBox.classList.add('hidden');
            menuButtons.classList.add('hidden');
            waitingRoom.classList.remove('hidden');
        });

        socket.on('lobbyUpdate', (data) => {
            currentGridSize = data.settings.grid;
            currentMode = data.settings.mode;
            currentGoal = data.settings.goal;
            
            setGrid.value = currentGridSize;
            setMode.value = currentMode;
            updateGoalOptions();
            setGoal.value = currentGoal;
            
            if (data.settings.tiles) {
                setWalls.value = data.settings.tiles.walls;
                setBad.value = data.settings.tiles.bad;
                setCrumbling.value = data.settings.tiles.crumbling;
                setDouble.value = data.settings.tiles.double;
                setPowerup.value = data.settings.tiles.powerup;
            }
            
            if (data.settings.theme) setTheme.value = data.settings.theme;
            
            if (data.settings.theme) {
                document.documentElement.style.setProperty('--on-color', data.settings.theme);
            }
            
            const cellSize = Math.floor(300 / currentGridSize) + 'px';
            document.documentElement.style.setProperty('--grid-size', currentGridSize);
            document.documentElement.style.setProperty('--cell-size', cellSize);
        });

        socket.on('lobbyCreated', (roomId) => {
            currentRoom = roomId;
            const shareLink = `${window.location.origin}/?room=${roomId}`;
            roomCodeDisplay.innerHTML = `Send this code to a friend:<br><br><span style="font-size:24px; color:#fff">${roomId}</span><br><br>Or send them this link:<br><a href="${shareLink}" target="_blank" style="color: white;">${shareLink}</a>`;
        });

        readyBtn.addEventListener('click', () => {
            socket.emit('toggleReady', currentRoom);
            readyBtn.innerText = "READY! (WAITING...)";
            readyBtn.style.backgroundColor = "#555";
        });

        socket.on('startGame', () => {
            startGame(); 
        });

        socket.on('opponentProgress', (data) => {});

        socket.on('matchEnded', (data) => {
            let myVal = (currentMode === 'timer') ? (score * 100) : timer;
            let oppVal = data.opponentScore;
            
            let msg = "";
            if (currentMode === 'timer') {
                 if (myVal > oppVal) msg = `<span style="color:#20fc03">YOU WON!</span><br><br>You: ${myVal}<br>Opponent: ${oppVal}`;
                 else if (myVal < oppVal) msg = `<span style="color:#fc2403">YOU LOST!</span><br><br>You: ${myVal}<br>Opponent: ${oppVal}`;
                 else msg = `IT'S A TIE!<br><br>Score: ${myVal}`;
            } else {
                 if (myVal < oppVal) msg = `<span style="color:#20fc03">YOU WON!</span><br><br>You: ${myVal}s<br>Opponent: ${oppVal}s`;
                 else if (myVal > oppVal) msg = `<span style="color:#fc2403">YOU LOST!</span><br><br>You: ${myVal}s<br>Opponent: ${oppVal}s`;
                 else msg = `IT'S A TIE!<br><br>Time: ${myVal}s`;
            }
            
            endGame(false, msg);
        });
    </script>
</body>
</html>
